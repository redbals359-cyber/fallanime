<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Between Sky and Earth</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(180deg, #101b35, #263b60, #6c7897);
    color: #fff;
    overflow-x: hidden;
    position: relative;
}

.rain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
}

.drop {
    position: absolute;
    top: -30px;
    width: 1px;
    height: 35px;
    background: linear-gradient(transparent, rgba(210, 230, 255, .65));
    animation: fall linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
    }
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff8, transparent),
      radial-gradient(2px 2px at 80% 20%, #fff9, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff9, transparent),
      radial-gradient(2px 2px at 35% 80%, #fff7, transparent);
}

.container {
    position: relative;
    z-index: 2;
    width: min(90%, 720px);
    margin: auto;
    padding: 55px 0;
    text-align: center;
}

.label {
    font-family: Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 5px;
    font-size: 10px;
    color: #c8d9f8;
    margin-bottom: 18px;
    animation: fadeIn 2s ease;
}

h1 {
    font-size: clamp(30px, 7vw, 55px);
    font-weight: normal;
    letter-spacing: 1px;
    margin-bottom: 12px;
    text-shadow: 0 0 30px #b9d6ff55;
    animation: fadeIn 2s ease;
}

.subtitle {
    color: #d0d9eb;
    font-style: italic;
    font-size: 15px;
    margin-bottom: 35px;
}

.video-frame {
    position: relative;
    padding: 8px;
    border: 1px solid rgba(210, 225, 255, .35);
    border-radius: 18px;
    background: rgba(255, 255, 255, .06);
    box-shadow: 0 15px 55px #0005;
    animation: rise 1.5s ease;
}

video {
    display: block;
    width: 100%;
    max-height: 75vh;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    background: #080d19;
    border-radius: 12px;
}

.caption-card {
    margin-top: 32px;
    padding: 30px 25px;
    border: 1px solid rgba(220, 230, 255, .2);
    border-radius: 16px;
    background: rgba(12, 24, 48, .35);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px #0002;
}

.caption-label {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
    color: #a9c9fa;
    margin-bottom: 20px;
}

#caption {
    font-size: clamp(16px, 3vw, 19px);
    line-height: 1.9;
    color: #f0f3fb;
    white-space: pre-wrap;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 18px;
    background: #c4dcff;
    margin-left: 3px;
    animation: blink .8s infinite;
    vertical-align: middle;
}

@keyframes blink {
    50% { opacity: 0; }
}

button {
    margin-top: 25px;
    padding: 12px 25px;
    border: 1px solid #c3d7f6a0;
    border-radius: 30px;
    background: transparent;
    color: white;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #dceaff20;
    transform: translateY(-2px);
}

footer {
    margin-top: 45px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: #c2cee3;
    opacity: .75;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .container { padding: 40px 0; }
    .caption-card { padding: 24px 18px; }
    .subtitle { font-size: 13px; }
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="rain" id="rain"></div>

<main class="container">

    <div class="label">A Story Written in the Sky</div>

    <h1>Between Sky & Earth</h1>

    <p class="subtitle">Somewhere between destiny and love.</p>

    <div class="video-frame">
        <video
            id="movie"
            controls
            playsinline
            preload="metadata"
            poster="">
            <source
                src="https://raw.githubusercontent.com/redbals359-cyber/fallanime/main/9563cdf182eed28c22a4f43cc1a57e12.mp4"
                type="video/mp4">
            Browser kamu tidak mendukung pemutaran video.
        </video>
    </div>

    <section class="caption-card">
        <div class="caption-label">✦ THE STORY ✦</div>

        <p id="caption"></p><span class="cursor" id="cursor"></span>

        <button id="replay">↻ Baca Kembali</button>
        <button id="copy">Salin Caption</button>
    </section>

    <footer>
        WEATHERING WITH YOU · TENKI NO KO
    </footer>

</main>

<script>
const text = `Di antara hamparan awan dan langit yang tak berujung, seorang perempuan jatuh perlahan, seolah semesta sedang mengembalikan sesuatu yang pernah dipinjamnya dari bumi. Namun, seorang laki-laki berlari mengejarnya, menembus batas antara kenyataan dan keajaiban, seakan jarak antara langit dan bumi hanyalah perkara keberanian. Ia tak peduli pada hujan yang mengancam dunia, tak gentar pada takdir yang mencoba memisahkan mereka; baginya, lebih baik hidup di dunia yang kehilangan cerahnya daripada tinggal di dunia yang tak lagi memiliki dirinya. Sebab, terkadang, cinta bukanlah tentang menyelamatkan seluruh dunia, melainkan tentang memilih seseorang yang membuat dunia itu layak untuk ditinggali.`;

const caption = document.getElementById("caption");
const cursor = document.getElementById("cursor");
const replay = document.getElementById("replay");
const copy = document.getElementById("copy");

let timer;
let index = 0;

function typeText() {
    clearInterval(timer);
    index = 0;
    caption.textContent = "";
    cursor.style.display = "inline-block";

    timer = setInterval(() => {
        caption.textContent += text.charAt(index);
        index++;

        if (index >= text.length) {
            clearInterval(timer);
            cursor.style.display = "none";
        }
    }, 32);
}

replay.addEventListener("click", typeText);

copy.addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText(text);
        copy.textContent = "✓ Caption Tersalin!";
    } catch {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        copy.textContent = "✓ Caption Tersalin!";
    }

    setTimeout(() => {
        copy.textContent = "Salin Caption";
    }, 2000);
});

// Membuat efek hujan dengan posisi dan kecepatan acak.
const rain = document.getElementById("rain");

for (let i = 0; i < 75; i++) {
    const drop = document.createElement("span");
    drop.className = "drop";
    drop.style.left = Math.random() * 100 + "%";
    drop.style.animationDuration = (0.6 + Math.random() * 1.2) + "s";
    drop.style.animationDelay = (-Math.random() * 3) + "s";
    drop.style.opacity = 0.2 + Math.random() * 0.5;
    rain.appendChild(drop);
}

typeText();
</script>

</body>
</html>
